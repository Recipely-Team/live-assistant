name: Release

# Publishes every package at the version in the tag.
#
# TWO WAYS TO AUTHENTICATE, and the job takes whichever exists:
#
# 1. **Trusted publishing** (preferred): npm exchanges GitHub's OIDC token for a
#    short-lived grant, and no credential lives in this repository. It needs
#    each package to name this workflow once on npmjs.com (package Settings ->
#    Trusted publisher -> GitHub Actions) — seven web forms, and until all seven
#    are filled in the registry answers `404 Not Found - PUT`, which reads like a
#    missing package rather than a missing grant.
# 2. **An `NPM_TOKEN` secret**: a granular access token with write access to the
#    `@live-assistant` scope. One web form and one `gh secret set`.
#
# The second exists because the first never got configured, and four releases in
# a row were published by hand instead — the fourth of them half-finished when a
# one-time password expired between packages. A token in a secret is a real cost
# and it is smaller than that: it is revocable, scoped to one npm scope, and it
# becomes dead weight the moment trusted publishing is set up, because npm
# prefers OIDC when both are available.
#
# To release: bump locally and push the tag.
#
#   npm version <x.y.z> --workspaces --include-workspace-root
#   git push --follow-tags
#
# Pass the version, not `patch`/`minor`/`major`: the tag npm writes comes from the
# workspace ROOT, so a relative bump there tags whatever the root happened to say
# rather than what the packages now say.
#
# The seven packages share one version, because the umbrella pins its five
# members exactly and a mismatch is not installable.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm falls back to looking for a token

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later; node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The artifact gate, before anything leaves the machine.
      - run: npm run check:pack

      - name: The tag must match the version being published
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./packages/assistant-core/package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $packaged" >&2
            exit 1
          fi
          echo "releasing $packaged"

      # One step, not seven, and it can be re-run.
      #
      # WHY IT SKIPS WHAT IS ALREADY THERE: 0.3.4 went out by hand because this
      # job could not authenticate, and the one-time password expired after two
      # of the seven packages — leaving a half-published release that a re-run
      # of seven plain `npm publish` calls would have failed on immediately, at
      # the first package that already existed. A release job is worth nothing
      # if it cannot finish a release that stopped halfway.
      #
      # Anything OTHER than "this exact version is already published" still
      # fails the job: `npm view` decides, so a genuine refusal is not confused
      # with an idempotent skip.
      #
      # Dependency order is kept: a package cannot install before the packages
      # it pins exist at that version.
      - name: Publish every package that is not already at this version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          version="$(node -p "require('./packages/assistant-core/package.json').version")"
          for pkg in core gemini audio react token-server widget react-native; do
            name="@live-assistant/$pkg"
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "::notice::$name@$version is already published — skipping"
              continue
            fi
            echo "publishing $name@$version"
            npm publish -w "$name"
          done
