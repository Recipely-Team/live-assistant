name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # First, because everything after it is only meaningful if the packages
      # are reading each other's source rather than the last release.
      - run: npm run check:links
      - run: npm run lint
      - run: npm run typecheck
      # Before the tests: a package that cannot build is not publishable, and
      # `prepublishOnly` would only find that out at `npm publish`.
      - run: npm run build
      - run: npm test
      # Nothing else notices a link that leads nowhere, and these pages are
      # read on npmjs.com where a broken one is the reader's dead end.
      - run: npm run check:docs

  pack:
    name: Every package packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm pack` is the only check that sees what an installer downloads.
      # A missing `main`, a `files` list that forgot dist/, or a stray test in
      # the tarball is invisible to every other gate.
      - name: Pack each package and assert its entry points exist
        run: node scripts/assert-tarballs.mjs

  example:
    name: The example still builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # An example nobody builds is an example that stops being true. This one
      # resolves the library through the workspace, so a breaking change here
      # fails before it is published.
      - run: npm run check:example
